<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The trip-readiness loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #faf9f5; --paper-2: #f0efe8; --ink: #1a1a2e; --muted: #4f5a57; --soft: #5c6663;
      --rule: rgba(26,26,46,0.12); --ink-30: rgba(26,26,46,0.30); --ink-20: rgba(26,26,46,0.20);
      --ink-10: rgba(26,26,46,0.10); --ink-06: rgba(26,26,46,0.06); --ink-05: rgba(26,26,46,0.05);
      --ink-03: rgba(26,26,46,0.03); --ink-02: rgba(26,26,46,0.02); --ink-40: rgba(26,26,46,0.40);
      --muted-15: rgba(79,90,87,0.15); --muted-45: rgba(79,90,87,0.45);
      --accent: #c2410c; --accent-tint: rgba(194,65,12,0.08); --accent-12: rgba(194,65,12,0.12); --accent-04: rgba(194,65,12,0.04);
      --link: #1a4f4e; --node-fill: #ffffff;
      --font-sans: 'Roboto', system-ui, sans-serif; --font-title: 'Barlow Condensed', 'Roboto', sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0c1311; --paper-2: #141d1a; --ink: #edf5ef; --muted: #a5ada8; --soft: #989f9b;
        --rule: rgba(237,245,239,0.12); --ink-30: rgba(237,245,239,0.30); --ink-20: rgba(237,245,239,0.20);
        --ink-10: rgba(237,245,239,0.10); --ink-06: rgba(237,245,239,0.06); --ink-05: rgba(237,245,239,0.05);
        --ink-03: rgba(237,245,239,0.03); --ink-02: rgba(237,245,239,0.02); --ink-40: rgba(237,245,239,0.40);
        --muted-15: rgba(165,173,168,0.15); --muted-45: rgba(165,173,168,0.45);
        --accent: #fb923c; --accent-tint: rgba(251,146,60,0.12); --accent-12: rgba(251,146,60,0.14); --accent-04: rgba(251,146,60,0.05);
        --link: #6fbfb2; --node-fill: #141d1a;
      }
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: 1.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.1; color: var(--ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    svg text { font-family: var(--font-sans); }
    svg text.mono { font-family: var(--font-mono); }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } body { padding: 0; min-height: 0; display: block; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Product loop</p>
    <h1>The trip-readiness loop</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trip-readiness-flow-title trip-readiness-flow-desc">
        <title id="trip-readiness-flow-title">The trip-readiness loop</title>
        <desc id="trip-readiness-flow-desc">Flowchart of the learner loop: enter the test city, date and target band, follow a weekly plan, practise writing and speaking daily with instant feedback, and two weeks out either book the trip or postpone with a coach week and return to practice.</desc>
        <defs>
          <marker id="f-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
          <marker id="f-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="var(--paper)"/>

        <line x1="440" y1="96" x2="440" y2="128" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#f-arrow)"/>
        <line x1="440" y1="176" x2="440" y2="208" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#f-arrow)"/>
        <line x1="440" y1="264" x2="440" y2="296" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#f-arrow)"/>
        <line x1="540" y1="344" x2="680" y2="344" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#f-arrow)"/>
        <line x1="440" y1="392" x2="440" y2="432" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#f-arrow-accent)"/>
        <path d="M760 320 L760 244 A8 8 0 0 0 752 236 L520 236" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#f-arrow)"/>

        <rect x="596" y="324" width="24" height="12" rx="2" fill="var(--paper)"/>
        <text x="608" y="333" fill="var(--muted)" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="448" y="404" width="32" height="12" rx="2" fill="var(--paper)"/>
        <text x="464" y="413" fill="var(--accent)" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="768" y="272" width="44" height="12" rx="2" fill="var(--paper)"/>
        <text x="790" y="281" fill="var(--muted)" font-size="8" class="mono" text-anchor="middle" letter-spacing="0.12em">RETRY</text>

        <rect x="340" y="40" width="200" height="56" rx="20" fill="var(--ink-03)" stroke="var(--ink-30)" stroke-width="1"/>
        <text x="440" y="64" fill="var(--ink)" font-size="12" font-weight="500" text-anchor="middle">Test city, date and target band</text>
        <text x="440" y="80" fill="var(--muted)" font-size="9" class="mono" text-anchor="middle">yerevan · tbilisi · dubai</text>

        <rect x="360" y="128" width="160" height="48" rx="6" fill="var(--node-fill)" stroke="var(--ink)" stroke-width="1"/>
        <text x="440" y="156" fill="var(--ink)" font-size="12" font-weight="500" text-anchor="middle">Weekly plan to the trip</text>

        <rect x="360" y="208" width="160" height="56" rx="6" fill="var(--node-fill)" stroke="var(--ink)" stroke-width="1"/>
        <text x="440" y="232" fill="var(--ink)" font-size="12" font-weight="500" text-anchor="middle">Daily writing and speaking</text>
        <text x="440" y="248" fill="var(--muted)" font-size="9" class="mono" text-anchor="middle">instant scored feedback</text>

        <polygon points="440,296 540,344 440,392 340,344" fill="var(--node-fill)" stroke="var(--ink)" stroke-width="1"/>
        <text x="440" y="342" fill="var(--ink)" font-size="12" font-weight="500" text-anchor="middle">Ready for band 7</text>
        <text x="440" y="356" fill="var(--ink)" font-size="12" font-weight="500" text-anchor="middle">two weeks out?</text>

        <rect x="680" y="320" width="160" height="48" rx="6" fill="var(--node-fill)" stroke="var(--ink)" stroke-width="1"/>
        <text x="760" y="340" fill="var(--ink)" font-size="12" font-weight="500" text-anchor="middle">Postpone, add coach week</text>
        <text x="760" y="356" fill="var(--muted)" font-size="9" class="mono" text-anchor="middle">human review of ai scores</text>

        <rect x="340" y="432" width="200" height="56" rx="20" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
        <text x="440" y="456" fill="var(--ink)" font-size="12" font-weight="500" text-anchor="middle">Book the trip and sit the test</text>
        <text x="440" y="472" fill="var(--muted)" font-size="9" class="mono" text-anchor="middle">one attempt, prepared</text>

        <line x1="40" y1="540" x2="920" y2="540" stroke="var(--ink-10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="var(--muted)" font-size="8" class="mono" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <rect x="40" y="572" width="24" height="12" rx="6" fill="var(--ink-03)" stroke="var(--ink-30)" stroke-width="1"/>
        <text x="72" y="582" fill="var(--muted)" font-size="8.5">Start or end</text>
        <rect x="180" y="572" width="24" height="12" rx="2" fill="var(--node-fill)" stroke="var(--ink)" stroke-width="1"/>
        <text x="212" y="582" fill="var(--muted)" font-size="8.5">Step</text>
        <polygon points="292,578 304,572 316,578 304,584" fill="var(--node-fill)" stroke="var(--ink)" stroke-width="1"/>
        <text x="328" y="582" fill="var(--muted)" font-size="8.5">Decision</text>
        <line x1="420" y1="580" x2="448" y2="580" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#f-arrow-accent)"/>
        <text x="456" y="582" fill="var(--muted)" font-size="8.5">Happy path</text>
        <line x1="560" y1="580" x2="588" y2="580" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#f-arrow)"/>
        <text x="596" y="582" fill="var(--muted)" font-size="8.5">Return to practice</text>
      </svg>
    </div>
  </div>
</body>
</html>
