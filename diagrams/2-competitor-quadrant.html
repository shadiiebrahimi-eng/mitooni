<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iranian IELTS competitors</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #faf9f5; --paper-2: #f0efe8; --ink: #1a1a2e; --muted: #4f5a57; --soft: #5c6663;
      --rule: rgba(26,26,46,0.12); --ink-30: rgba(26,26,46,0.30); --ink-20: rgba(26,26,46,0.20);
      --ink-10: rgba(26,26,46,0.10); --ink-06: rgba(26,26,46,0.06); --ink-05: rgba(26,26,46,0.05);
      --ink-03: rgba(26,26,46,0.03); --ink-02: rgba(26,26,46,0.02); --ink-40: rgba(26,26,46,0.40);
      --muted-15: rgba(79,90,87,0.15); --muted-45: rgba(79,90,87,0.45);
      --accent: #c2410c; --accent-tint: rgba(194,65,12,0.08); --accent-12: rgba(194,65,12,0.12); --accent-04: rgba(194,65,12,0.04);
      --link: #1a4f4e; --node-fill: #ffffff;
      --font-sans: 'Roboto', system-ui, sans-serif; --font-title: 'Barlow Condensed', 'Roboto', sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0c1311; --paper-2: #141d1a; --ink: #edf5ef; --muted: #a5ada8; --soft: #989f9b;
        --rule: rgba(237,245,239,0.12); --ink-30: rgba(237,245,239,0.30); --ink-20: rgba(237,245,239,0.20);
        --ink-10: rgba(237,245,239,0.10); --ink-06: rgba(237,245,239,0.06); --ink-05: rgba(237,245,239,0.05);
        --ink-03: rgba(237,245,239,0.03); --ink-02: rgba(237,245,239,0.02); --ink-40: rgba(237,245,239,0.40);
        --muted-15: rgba(165,173,168,0.15); --muted-45: rgba(165,173,168,0.45);
        --accent: #fb923c; --accent-tint: rgba(251,146,60,0.12); --accent-12: rgba(251,146,60,0.14); --accent-04: rgba(251,146,60,0.05);
        --link: #6fbfb2; --node-fill: #141d1a;
      }
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-title); font-size: 1.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.1; color: var(--ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    svg text { font-family: var(--font-sans); }
    svg text.mono { font-family: var(--font-mono); }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } body { padding: 0; min-height: 0; display: block; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant · Iran IELTS market</p>
    <h1>Competitors by feedback and reach</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="iran-competitors-quadrant-title iran-competitors-quadrant-desc">
        <title id="iran-competitors-quadrant-title">Iranian IELTS competitors, feedback against reach</title>
        <desc id="iran-competitors-quadrant-desc">Quadrant placing twelve Iranian IELTS players by how instant their feedback is and how many learners they reach, with the open top-right ground where an AI tutor with calibrated feedback and real distribution would sit.</desc>
        <defs>
          <marker id="q-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="var(--paper)"/>

        <rect x="500" y="88" width="360" height="162" fill="var(--accent-04)"/>

        <line x1="120" y1="250" x2="872" y2="250" stroke="var(--muted-45)" stroke-width="1" marker-end="url(#q-arrow)"/>
        <line x1="500" y1="420" x2="500" y2="88" stroke="var(--muted-45)" stroke-width="1" marker-end="url(#q-arrow)"/>

        <text x="884" y="253" fill="var(--ink)" font-size="9" class="mono" letter-spacing="0.18em" dominant-baseline="middle">INSTANT</text>
        <text x="108" y="253" fill="var(--ink)" font-size="9" class="mono" text-anchor="end" letter-spacing="0.18em" dominant-baseline="middle">MANUAL</text>
        <text x="500" y="72" fill="var(--ink)" font-size="9" class="mono" text-anchor="middle" letter-spacing="0.18em">MANY</text>
        <text x="500" y="442" fill="var(--ink)" font-size="9" class="mono" text-anchor="middle" letter-spacing="0.18em">FEW</text>

        <text x="140" y="108" fill="var(--muted)" font-size="9" class="mono" letter-spacing="0.18em">INSTITUTES</text>
        <text x="860" y="108" fill="var(--accent)" font-size="9" class="mono" text-anchor="end" letter-spacing="0.18em" font-weight="600">OPEN GROUND</text>
        <text x="140" y="412" fill="var(--muted)" font-size="9" class="mono" letter-spacing="0.18em">TUTOR MARKET</text>
        <text x="860" y="412" fill="var(--muted)" font-size="9" class="mono" text-anchor="end" letter-spacing="0.18em">AI LOCALS</text>

        <circle cx="190" cy="120" r="4" fill="var(--ink)"/>
        <text x="202" y="124" fill="var(--muted)" font-size="11">Afarinesh</text>
        <circle cx="390" cy="110" r="4" fill="var(--ink)"/>
        <text x="402" y="114" fill="var(--muted)" font-size="11">Zabanshenas</text>
        <circle cx="250" cy="160" r="4" fill="var(--ink)"/>
        <text x="262" y="164" fill="var(--muted)" font-size="11">IELTS Tehran</text>
        <circle cx="340" cy="140" r="4" fill="var(--ink)"/>
        <text x="352" y="144" fill="var(--muted)" font-size="11">Maktabkhooneh</text>
        <circle cx="300" cy="200" r="4" fill="var(--ink)"/>
        <text x="312" y="204" fill="var(--muted)" font-size="11">Irsafam</text>
        <circle cx="160" cy="210" r="4" fill="var(--ink)"/>
        <text x="172" y="214" fill="var(--muted)" font-size="11">Safir</text>

        <circle cx="230" cy="340" r="4" fill="var(--ink)"/>
        <text x="242" y="344" fill="var(--muted)" font-size="11">Ostadbank tutors</text>
        <circle cx="300" cy="390" r="4" fill="var(--ink)"/>
        <text x="312" y="394" fill="var(--muted)" font-size="11">Iranmehr</text>

        <circle cx="790" cy="300" r="4" fill="var(--ink)"/>
        <text x="802" y="304" fill="var(--muted)" font-size="11">Fastdic AI</text>
        <circle cx="700" cy="380" r="4" fill="var(--ink)"/>
        <text x="712" y="384" fill="var(--muted)" font-size="11">Testinno</text>
        <circle cx="620" cy="420" r="4" fill="var(--ink)"/>
        <text x="632" y="424" fill="var(--muted)" font-size="11">AI Guru</text>

        <circle cx="800" cy="130" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="812" y="134" fill="var(--muted)" font-size="11">ChatGPT via VPN</text>
        <circle cx="640" cy="170" r="6" fill="var(--accent)"/>
        <text x="652" y="174" fill="var(--ink)" font-size="11" font-weight="500">Our product</text>

        <line x1="40" y1="456" x2="920" y2="456" stroke="var(--ink-10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="var(--muted)" font-size="8" class="mono" letter-spacing="0.18em">LEGEND</text>
        <circle cx="52" cy="488" r="6" fill="var(--accent)"/>
        <text x="68" y="492" fill="var(--muted)" font-size="8.5">Where we position</text>
        <circle cx="180" cy="488" r="4" fill="var(--ink)"/>
        <text x="196" y="492" fill="var(--muted)" font-size="8.5">Competitor</text>
        <circle cx="276" cy="488" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="292" y="492" fill="var(--muted)" font-size="8.5">Free foreign chatbot, uncalibrated</text>
        <text x="476" y="492" fill="var(--muted)" font-size="8.5" font-style="italic">Position is the signal; placement is qualitative, from the October 2026 research.</text>
      </svg>
    </div>
  </div>
</body>
</html>
